[package]
name = "revmc-examples-runner"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
exclude.workspace = true

[build-dependencies]
revmc = { workspace = true, features = ["llvm-prefer-dynamic"] }
revmc-build.workspace = true
cc = "1.0"

[dependencies]
revmc-builtins = { workspace = true, default-features = false }
revmc-context = { workspace = true, default-features = false }

revm = { workspace = true, default-features = false, features = ["std", "serde"] }
op-revm = { git = "ssh://git@github.com/Altius-Parallel-EVM/revm", branch = "jit-integration", default-features = false, features = ["std"] }

# Used by jsonl_bench / bin_bench binaries
revmc = { workspace = true, features = ["llvm-prefer-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
libloading = "0.8"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"
k256 = "0.13"

[[bin]]
name = "jsonl_bench"
path = "src/bin/jsonl_bench.rs"

[[bin]]
name = "bin_bench"
path = "src/bin/bin_bench.rs"

[[bin]]
name = "precompile"
path = "src/bin/precompile.rs"

[[bin]]
name = "compile_profile"
path = "src/bin/compile_profile.rs"

[[bin]]
name = "scan_codes"
path = "src/bin/scan_codes.rs"

[[bin]]
name = "gas_debug"
path = "src/bin/gas_debug.rs"

[[bin]]
name = "frame_bench"
path = "src/bin/frame_bench.rs"

[[bin]]
name = "ablation_bench"
path = "src/bin/ablation_bench.rs"

[[bin]]
name = "selective_demo"
path = "src/bin/selective_demo.rs"

[[bin]]
name = "icache_experiment"
path = "src/bin/icache_experiment.rs"

[[bin]]
name = "fullblock_ablation"
path = "src/bin/fullblock_ablation.rs"

[[bin]]
name = "opcode_dedup"
path = "src/bin/opcode_dedup.rs"

[[bin]]
name = "skeleton_export"
path = "src/bin/skeleton_export.rs"

[[bin]]
name = "skeleton_identify"
path = "src/bin/skeleton_identify.rs"

[[bench]]
name = "bench_airdrop"
path = "src/bench_airdrop.rs"
harness = false

[[bench]]
name = "bench_json_test"
path = "src/bench_json_test.rs"
harness = false

[[bench]]
name = "bench_burntpix"
path = "src/bench_burntpix.rs"
harness = false

[[bench]]
name = "bench_curve"
path = "src/bench_curve.rs"
harness = false

[[bench]]
name = "bench_snailtracer"
path = "src/bench_snailtracer.rs"
harness = false
