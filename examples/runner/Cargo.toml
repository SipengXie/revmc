[package]
name = "revmc-examples-runner"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
exclude.workspace = true

[build-dependencies]
revmc = { workspace = true, features = ["llvm-prefer-dynamic"] }
revmc-build.workspace = true
cc = "1.0"

[dependencies]
revmc-builtins = { workspace = true, default-features = false }
revmc-context = { workspace = true, default-features = false }

revm = { workspace = true, default-features = false, features = ["std", "serde"] }
op-revm = { git = "https://github.com/SipengXie2024/skelot-revm", rev = "db2ea6755d1d1b235843b7e9894160a0022f949b", default-features = false, features = ["std"] }

# Used by jsonl_bench / bin_bench binaries
revmc = { workspace = true, features = ["llvm-prefer-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
hex-literal = "0.4"
libloading = "0.8"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
k256 = "0.13"
libm = "0.2"
ureq = { version = "2", features = ["json"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"
perf-event = "0.4"
perf-event-open-sys = "6"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "jsonl_bench"
path = "src/bin/jsonl_bench.rs"

